name: release

# 打标签即发版：git tag vX.Y.Z && git push origin vX.Y.Z
# 流程：质量门（tsc+单测）→ ODS 校验 → Windows 构建 Tauri → Release 挂标准化资产 + SHA-256
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gate:
    name: 质量门（tsc + 单测 + ODS 校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: ODS 五道发布门禁（缺任一项即拒绝发布）
        env:
          VER: ${{ github.ref_name }}
        run: |
          V="${VER#v}"
          python scripts/ods.py validate-config --config onlytools.config.json
          python scripts/ods.py validate-readme --readme README.md
          python scripts/ods.py validate-version --version "$V"
          python scripts/ods.py validate-changelog --version "$V"
          NOTES="RELEASE-NOTES-${VER}.md"
          test -f "$NOTES" || { echo "::error::缺少发布说明 $NOTES（先写发布说明再打 tag）"; exit 1; }
          python scripts/ods.py validate-release --notes "$NOTES" --version "$V"

  build-release:
    name: 构建并发布 Release
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: 读取发布说明（RELEASE-NOTES-<tag>.md）
        id: notes
        shell: bash
        run: |
          F="RELEASE-NOTES-${GITHUB_REF_NAME}.md"
          # gate 已强制该文件存在且通过校验，这里直读
          { echo 'body<<EOF'; cat "$F"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      # tauri-action：执行 npm run tauri:build（自动先跑 beforeBuildCommand=vite build），
      # 创建 Release 并自动上传 NSIS/MSI 安装包
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OnlyRep ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true  # 先 Draft：资产清理与最终清单核验不过则不公开
          prerelease: false
          args: --bundles nsis,msi

      # 资产命名统一 ONLYTOOLS 标准：{product}-类型-v{version}-{arch}.后缀
      # tauri-action 上传的安装包资产名无法定制 → 下载重命名后替换（保留原始上传的历史不动，新资产为标准名）
      - name: 准备标准化资产
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          NSIS=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          cp "$NSIS" "out/OnlyRep-Setup-v${VER}-x64.exe"
          cp "$MSI" "out/OnlyRep-Setup-v${VER}-x64.msi"
          cp src-tauri/target/release/onlyrep.exe "out/OnlyRep-Portable-v${VER}-x64.exe"
          cp dist/index.html "out/OnlyRep-Web-v${VER}.html"

      - name: 计算 SHA-256
        shell: bash
        run: |
          cd out
          python ../scripts/ods.py hash-artifacts * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传标准资产与校验和
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            out/OnlyRep-Setup-v*-x64.exe
            out/OnlyRep-Setup-v*-x64.msi
            out/OnlyRep-Portable-v*-x64.exe
            out/OnlyRep-Web-v*.html
            out/SHA256SUMS.txt

      # Draft 收尾：白名单删多余资产 → 最终清单核验 → 全过才 Draft 转正式（失败则 Draft 不公开）
      - name: 资产收尾与发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python scripts/finalize_release.py
