name: Prepare Release Notes Draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, e.g. 1.2.3'
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python scripts/ods.py release-notes --config onlytools.config.json --changelog CHANGELOG.md --version "${{ inputs.version }}" --output RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes-draft
          path: RELEASE_NOTES.md
